# Cold Start domain catalog — the "clients" whose codebases you get dropped into.
#
# The architect picks one domain per case (avoiding recent repeats). `shapes`
# are the codebase styles that fit the domain; `affinities` are concept ids
# (from concepts.yaml) that show up naturally there. Every system must run
# fully offline: fake HTTP layers, in-memory services, sqlite, local files.
#
# shapes: service | cli | library | pipeline | worker | simulation | interpreter

domains:
  # ----------------------------------------------------------- transport ----
  - id: ferry-booking
    name: Ferry booking & seat allocation
    sector: transport
    flavor: "A regional ferry operator's booking backend: sailings, vehicle deck lanes measured in meters, fare classes, and seat holds that expire if unpaid."
    shapes: [service, library]
    affinities: [ds-intervals, datetime-timezones, decimal-money]

  - id: transit-transfer-planner
    name: Transit transfer planner
    sector: transport
    flavor: "A city transit authority's journey planner: timetables, walking transfers between stops, and 'arrive by' queries that must respect minimum connection times."
    shapes: [library, cli]
    affinities: [algo-dijkstra, algo-calendar-scheduling, ds-graphs, algo-binary-search]

  - id: car-rental-fleet
    name: Car rental fleet management
    sector: transport
    flavor: "A car rental company's fleet system: vehicles move between available, rented and in-maintenance, pickups and drop-offs span branches, and late returns incur fees."
    shapes: [service]
    affinities: [eng-state-machines, ds-intervals, decimal-money, enums]

  - id: bike-share-rebalancing
    name: Bike-share rebalancing
    sector: transport
    flavor: "A bike-share operator's overnight planner that decides which vans move how many bikes between docks based on predicted morning demand."
    shapes: [simulation, worker]
    affinities: [ds-heaps, algo-greedy, algo-numeric-geometry, algo-simulation]

  - id: parking-garage-billing
    name: Parking garage occupancy & billing
    sector: transport
    flavor: "A downtown garage chain's gate and billing system: entry/exit events, hourly rates with daily caps, monthly permits and lost-ticket rules."
