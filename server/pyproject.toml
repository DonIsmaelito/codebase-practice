[project]
name = "coldstart"
version = "0.1.0"
description = "A practice gym for getting fast at unfamiliar Python codebases."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "jedi>=0.19",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
coldstart = "coldstart.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["coldstart"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
