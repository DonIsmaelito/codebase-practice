  - id: ride-surge-pricing
    name: Ride-hailing surge pricing
    sector: transport
    flavor: "A ride-hailing marketplace's pricing service that computes surge multipliers per city zone from rolling counts of ride requests and available drivers."
    shapes: [service]
    affinities: [algo-sliding-window, sys-caching, numeric-semantics, decimal-money]

  - id: flight-crew-scheduling
    name: Flight crew duty scheduling
    sector: travel
    flavor: "An airline's crew-rostering tool that assigns pilots and cabin crew to flights while enforcing rest rules, duty-hour caps and return-to-base constraints."
